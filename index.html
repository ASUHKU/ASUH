<!-- Firebase SDK + Auth + Firestore: ASUH -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
  import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-analytics.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    deleteDoc
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBC1JNLFyJ-zDKKnVeBzVjVBvj_YRb8IjM",
    authDomain: "asuh-51d4e.firebaseapp.com",
    projectId: "asuh-51d4e",
    storageBucket: "asuh-51d4e.firebasestorage.app",
    messagingSenderId: "48135913150",
    appId: "1:48135913150:web:3041a2cf3a7079eeb268ef",
    measurementId: "G-5CSTE8WRTW"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const db = getFirestore(firebaseApp);

  if (await isSupported()) {
    getAnalytics(firebaseApp);
  }

  window.ASUH_FIREBASE = {
    app: firebaseApp,
    auth: auth,
    db: db,
    config: firebaseConfig
  };

  let authMode = "login";
  let currentUid = null;
  let saveTimer = null;
  let cloudReady = false;

  function setAuthMessage(msg, ok = false) {
    const el = document.getElementById("authMsg");
    if (!el) return;
    el.textContent = msg || "";
    el.classList.toggle("ok", !!ok);
  }

  function toggleAuthMode() {
    authMode = authMode === "login" ? "signup" : "login";
    document.getElementById("authTitle").textContent =
      authMode === "login" ? "Log masuk untuk teruskan" : "Daftar akaun ASUH";
    document.getElementById("authSubmit").textContent =
      authMode === "login" ? "Log Masuk" : "Daftar Akaun";
    document.getElementById("authSwitch").textContent =
      authMode === "login" ? "Belum ada akaun? Daftar" : "Sudah ada akaun? Log masuk";
    setAuthMessage("");
  }

  async function submitAuth() {
    const email = (document.getElementById("authEmail").value || "").trim();
    const password = document.getElementById("authPassword").value || "";
    if (!email || password.length < 6) {
      return setAuthMessage("Masukkan e-mel dan kata laluan sekurang-kurangnya 6 aksara.");
    }
    setAuthMessage("Sedang memproses...");
    try {
      if (authMode === "login") {
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        await createUserWithEmailAndPassword(auth, email, password);
        setAuthMessage("Akaun berjaya didaftarkan. Anda telah log masuk.", true);
      }
      setAuthMessage("");
    } catch (e) {
      let msg = "Tidak berjaya.";
      const code = e && e.code ? e.code : "";
      if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") {
        msg = "E-mel atau kata laluan salah.";
      } else if (code === "auth/email-already-in-use") {
        msg = "E-mel ini sudah didaftarkan. Sila log masuk.";
      } else if (code === "auth/weak-password") {
        msg = "Kata laluan terlalu lemah (minimum 6 aksara).";
      } else if (code === "auth/invalid-email") {
        msg = "Format e-mel tidak sah.";
      } else if (code === "auth/too-many-requests") {
        msg = "Terlalu banyak percubaan. Cuba lagi sebentar.";
      } else if (code === "auth/network-request-failed") {
        msg = "Masalah rangkaian. Semak internet anda.";
      } else if (code === "auth/operation-not-allowed") {
        msg = "Email/Password belum diaktifkan di Firebase Console.";
      } else if (e && e.message) {
        msg = e.message;
      }
      setAuthMessage(msg);
    }
  }

  function asuhLogout() {
    cloudReady = false;
    currentUid = null;
    signOut(auth).catch(() => {});
  }

  function dataRef(uid) {
    return doc(db, "users", uid, "app", "data");
  }

  function snapshotFromGlobals() {
    // Read live state from the classic script scope via window helpers
    if (typeof window.ASUH_GET_STATE === "function") {
      return window.ASUH_GET_STATE();
    }
    return null;
  }

  function applyState(state) {
    if (typeof window.ASUH_SET_STATE === "function") {
      window.ASUH_SET_STATE(state);
    }
  }

  async function loadCloudData(uid) {
    try {
      const snap = await getDoc(dataRef(uid));
      if (snap.exists()) {
        applyState(snap.data());
        // also mirror to local cache
        try {
          localStorage.setItem("asuh_fasa1", JSON.stringify(snap.data()));
        } catch (e) {}
        return true;
      }
    } catch (e) {
      console.warn("ASUH loadCloud failed", e);
    }
    return false;
  }

  async function saveCloudData(uid, state) {
    if (!uid || !state) return;
    try {
      await setDoc(dataRef(uid), {
        ...state,
        updatedAt: new Date().toISOString()
      }, { merge: true });
    } catch (e) {
      console.warn("ASUH saveCloud failed", e);
    }
  }

  function scheduleCloudSave() {
    if (!currentUid || !cloudReady) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const state = snapshotFromGlobals();
      if (state) saveCloudData(currentUid, state);
    }, 400);
  }

  async function deleteCloudData(uid) {
    if (!uid) return;
    try {
      await deleteDoc(dataRef(uid));
    } catch (e) {
      console.warn("ASUH deleteCloud failed", e);
    }
  }

  onAuthStateChanged(auth, async (user) => {
    const gate = document.getElementById("authGate");
    if (!gate) return;
    if (user) {
      currentUid = user.uid;
      gate.classList.add("authHidden");
      // Load cloud first; if empty, push local/defaults to cloud
      const hadCloud = await loadCloudData(user.uid);
      if (!hadCloud) {
        // Prefer existing local data (migrate), else current defaults already in memory
        try {
          const local = JSON.parse(localStorage.getItem("asuh_fasa1") || "null");
          if (local) applyState(local);
        } catch (e) {}
        const state = snapshotFromGlobals();
        if (state) await saveCloudData(user.uid, state);
      }
      cloudReady = true;
      if (typeof window.ASUH_AFTER_AUTH === "function") window.ASUH_AFTER_AUTH();
    } else {
      cloudReady = false;
      currentUid = null;
      gate.classList.remove("authHidden");
    }
  });

  window.submitAuth = submitAuth;
  window.toggleAuthMode = toggleAuthMode;
  window.asuhLogout = asuhLogout;
  window.setAuthMessage = setAuthMessage;
  window.ASUH_SCHEDULE_CLOUD_SAVE = scheduleCloudSave;

function familyHome() {
    let total = Object.values(K).reduce((s, k) => s + k.bal, 0);
    V.innerHTML = quoteCard() + `<section class="card">
 <div class="head"><div><h3>👨‍👩‍👧‍👦 Anak-anak</h3><span>Pilih anak untuk lihat halaman mereka</span></div></div>
 ${Object.entries(K).map(([id, k]) => `<button class="quicktask" onclick="cur='${id}';page='child';tab='tasks';render()">
   <div class="qico">${k.a}</div><div class="qname">${k.n}</div><div class="qpts">⭐ ${k.bal}</div>
 </button>`).join("")}
 <div class="total">Jumlah baki bintang keluarga<strong>⭐ ${total.toLocaleString()}</strong></div>
 </section>`;
}
function childTabs() {
    return `<div class="tabs"><button class="tab ${tab == "tasks" ? "on" : ""}" onclick="tab='tasks';childPage()">Tugasan</button>
 <button class="tab ${tab == "performance" ? "on" : ""}" onclick="tab='performance';childPage()">Prestasi</button>
 <button class="tab ${tab == "info" ? "on" : ""}" onclick="tab='info';childPage()">Maklumat</button></div>`;
}
function childPage() {
    let k = K[cur];
    if (tab == "tasks") {
        let sum = k.today.reduce((a, x) => a + x[2], 0);
        V.innerHTML = hero() + childTabs() + `<section class="card"><div class="head"><h3>✓ Tugasan Selesai Hari Ini</h3><span>${k.today.length} tugasan</span></div>
   ${k.today.length ? k.today.map(t => `<div class="task"><div class="ico">${t[0]}</div><div class="info"><div class="name">${t[1]}</div><div class="meta">✓ Direkod ibu bapa</div></div><div class="pts">+${t[2]} <span>★</span></div></div>`).join("") : `<div class="empty">Belum ada tugasan direkod hari ini.</div>`}
   <div class="total">Jumlah hari ini<strong>⭐ ${sum} Bintang</strong></div></section>`;
    }
    else if (tab == "performance") {
        V.innerHTML = hero() + childTabs() + `<section class="card"><div class="head"><h3>📊 Prestasi ${k.n}</h3><span>Keseluruhan</span></div>
   <div class="summary"><div class="metric"><strong>⭐ ${k.year.toLocaleString()}</strong><span>Bintang tahun ini</span></div>
   <div class="metric"><strong>⭐ ${k.month.toLocaleString()}</strong><span>Bintang bulan ini</span></div>
   <div class="metric"><strong>${k.total}</strong><span>Jumlah tugasan</span></div>
   <div class="metric"><strong>⭐ ${k.bal}</strong><span>Baki semasa</span></div></div></section>`;
    }
    else {
        let fm = familyMembers.find(x => x.name === k.n && x.relation === "Anak");
        V.innerHTML = hero() + childTabs() + `<section class="card"><div class="head"><h3>👤 Maklumat ${k.n}</h3></div>
   ${fm ? `<div class="familyrow"><div class="fav">${fm.avatar}</div><div class="fbody"><div class="fline"><div class="fname">${fm.name}</div><div class="fage">${ageFromBirth(fm.birth)} tahun</div></div><div class="fmeta">🎂 ${niceDate(fm.birth)}</div></div></div>` : ""}
   </section>`;
    }
}
function rewardPage() { let k = K[cur]; V.innerHTML = hero() + `<section class="card"><div class="head"><div><h3>🎁 Ganjaran Keluarga</h3><span>Sama untuk semua anak</span></div><button class="fab" onclick="rewardForm()">+ Ganjaran</button></div>${rewards.map((r, i) => { let ok = k.bal >= r[2], pc = Math.min(100, k.bal / r[2] * 100); return `<div class="reward"><div class="ico">${r[0]}</div><div class="info"><div class="name">${r[1]}</div><div class="meta">${k.bal}/${r[2]} ⭐ ${ok ? "• Sudah cukup" : "• Lagi " + (r[2] - k.bal) + " ⭐"}</div><div class="progress"><i style="width:${pc}%"></i></div></div><div class="pts">${r[2]} <span>★</span></div><button class="action ${ok ? "" : "lock"}" onclick="${ok ? `redeem(${i})` : ""}">${ok ? "Tebus" : "Belum"}</button><button class="rewardDelete" onclick="deleteReward(${i})" title="Padam ganjaran">🗑️</button></div>`; }).join("")}</section>`; }
function deleteReward(i) {
    const r = rewards[i];
    if (!r)
        return;
    if (!confirm(`Padam ganjaran ${r[1]}?`))
        return;
    rewards.splice(i, 1);
    saveLocal();
    rewardPage();
}
function report() { let arr = Object.values(K).sort((a, b) => b[period] - a[period]), sum = arr.reduce((a, k) => a + k[period], 0); V.innerHTML = `<section class="card"><div class="head"><div><h3>📊 Laporan Keluarga</h3><span>Semua anak mengikut jumlah bintang</span></div></div><div class="switch"><button class="sw ${period == "month" ? "on" : ""}" onclick="period='month';report()">Bulanan</button><button class="sw ${period == "year" ? "on" : ""}" onclick="period='year';report()">Tahunan</button></div>${arr.map((k, i) => `<div class="rank"><div class="rankno">${["🥇", "🥈", "🥉"][i] || i + 1}</div><div class="ico">${k.a}</div><div class="info"><div class="name">${k.n}</div><div class="meta">${period == "month" ? "September 2026" : "Tahun 2026"}</div></div><div class="pts">⭐ ${k[period].toLocaleString()}</div></div>`).join("")}<div class="summary"><div class="metric"><strong>⭐ ${sum.toLocaleString()}</strong><span>Jumlah bintang ${period == "month" ? "bulan ini" : "tahun ini"}</span></div><div class="metric"><strong>${arr.reduce((a, k) => a + k.total, 0)}</strong><span>Jumlah tugasan direkod</span></div></div></section>`; }
function ageFromBirth(birth) {
    let b = new Date(birth + "T00:00:00"), d = new Date(), a = d.getFullYear() - b.getFullYear();
    let m = d.getMonth() - b.getMonth();
    if (m < 0 || (m === 0 && d.getDate() < b.getDate()))
        a--;
    return a;
}
function niceDate(birth) {
    let d = new Date(birth + "T00:00:00");
    return d.toLocaleDateString("ms-MY", { day: "numeric", month: "short", year: "numeric" });
}
function memberRows(relations) {
    return familyMembers.filter(x => relations.includes(x.relation)).map((m) => { let idx = familyMembers.indexOf(m); return `<div class="familyrow"><div class="fav">${m.avatar}</div><div class="fbody"><div class="fline"><div class="fname">${m.name}</div><div class="profileActions"><div class="fage">${ageFromBirth(m.birth)} tahun</div><button class="memberEdit" onclick="editMemberForm(${idx})">Edit</button></div></div><div class="fmeta">${m.relation} • 🎂 ${niceDate(m.birth)}</div></div></div>`; }).join("");
}
function profilePage() {
    V.innerHTML = `<section class="card"><div class="head"><div><h3>👨‍👩‍👧‍👦 Profil Keluarga</h3><span>${familyName} • ${familyMembers.length} ahli</span></div><div class="profileActions"><button class="settingsBtn" onclick="settingsForm()" title="Tetapan">⚙️</button><button class="editmini" onclick="familyForm()">＋ Ahli</button></div></div>
 <div class="sectionTitle">IBU BAPA</div>${memberRows(["Ayah", "Ibu", "Penjaga"])}
 <div class="sectionTitle">ANAK-ANAK</div>${memberRows(["Anak"])}
 <div class="dangerZone"><div class="dangerTitle">AKAUN & DATA</div>
 <button class="cancelBtn" style="margin-top:0" onclick="asuhLogout()">🚪 Log Keluar</button>
 <button class="dangerBtn" style="margin-top:8px" onclick="deleteAllDataForm()">🗑️ Hapuskan Semua Data</button></div>
 </section>`;
}
function settingsForm() {
    P.innerHTML = `<button class="close" onclick="S.classList.remove('on')">✕</button><h2>⚙️ Tetapan Keluarga</h2>
 <div class="sub">Edit nama keluarga yang dipaparkan dalam aplikasi.</div>
 <label>Nama keluarga</label><input id="setFamilyName" value="${familyName.replace(/"/g, '&quot;')}" placeholder="Contoh: Keluarga Harris">
 <button class="save" onclick="saveSettings()">Simpan Tetapan</button>`;
    S.classList.add("on");
}
function saveSettings() {
    let n = setFamilyName.value.trim();
    if (!n)
        return alert("Masukkan nama keluarga.");
    familyName = n;
    saveLocal();
    S.classList.remove("on");
    render();
}
function editMemberForm(idx) {
    let m = familyMembers[idx];
    P.innerHTML = `<button class="close" onclick="S.classList.remove('on')">✕</button><h2>Edit Ahli Keluarga</h2>
 <div class="sub">Ubah nama, hubungan, avatar atau tarikh lahir.</div>
 <label>Nama</label><input id="emName" value="${m.name.replace(/"/g, '&quot;')}">
 <label>Hubungan</label><select id="emRel">${["Ayah", "Ibu", "Anak", "Penjaga"].map(r => `<option ${r === m.relation ? "selected" : ""}>${r}</option>`).join("")}</select>
 <label>Avatar</label><select id="emAv">${["👨🏻", "👩🏻", "👦🏻", "👧🏻", "🧒🏻", "🧕🏻", "👤"].map(a => `<option ${a === m.avatar ? "selected" : ""}>${a}</option>`).join("")}</select>
 <label>Tarikh lahir</label><input id="emBirth" type="date" value="${m.birth}">
 <button class="save" onclick="saveMemberEdit(${idx})">Simpan Perubahan</button>`;
    S.classList.add("on");
}
function saveMemberEdit(idx) {
    let old = familyMembers[idx], oldName = old.name, n = emName.value.trim(), r = emRel.value, a = emAv.value, b = emBirth.value;
    if (!n || !b)
        return alert("Lengkapkan nama dan tarikh lahir.");
    familyMembers[idx] = { name: n, relation: r, birth: b, avatar: a };
    let kidEntry = Object.entries(K).find(([id, k]) => k.n === oldName);
    if (kidEntry) {
        let [id, k] = kidEntry;
        if (r === "Anak") {
            k.n = n;
            k.a = a;
        }
        else {
            delete K[id];
            if (cur === id)
                cur = Object.keys(K)[0];
        }
    }
    else if (r === "Anak") {
        let id = "kid" + Date.now();
        K[id] = { n: n, a: a, bal: 0, month: 0, year: 0, total: 0, today: [] };
    }
    saveLocal();
    S.classList.remove("on");
    page = "profile";
    render();
}
function deleteAllDataForm() {
    P.innerHTML = `<button class="close" onclick="S.classList.remove('on')">✕</button>
 <h2>Hapuskan Semua Data?</h2>
 <div class="confirmBox"><strong>⚠️ Tindakan ini tidak boleh dibatalkan.</strong><br><br>
 Semua nama keluarga, ahli keluarga, tugasan, bintang, ganjaran dan rekod prestasi yang disimpan pada peranti ini akan dipadam.</div>
 <label>Taip HAPUS untuk pengesahan</label>
 <input id="deleteConfirm" autocomplete="off" placeholder="HAPUS">
 <button class="dangerBtn" style="margin-top:14px" onclick="confirmDeleteAll()">Ya, Hapuskan Semua Data</button>
 <button class="cancelBtn" onclick="S.classList.remove('on')">Batal</button>`;
    S.classList.add("on");
}
function confirmDeleteAll() {
    if ((deleteConfirm.value || "").trim().toUpperCase() !== "HAPUS")
        return alert('Taip "HAPUS" untuk mengesahkan.');
    try {
        localStorage.removeItem("asuh_fasa1");
    } catch (e) {}
    if (typeof window.ASUH_DELETE_CLOUD === "function") {
        window.ASUH_DELETE_CLOUD();
    }
    location.reload();
}
function familyForm() {
    P.innerHTML = `<button class="close" onclick="S.classList.remove('on')">✕</button><h2>Tambah Ahli Keluarga</h2>
 <div class="sub">Umur akan dikira secara automatik daripada tarikh lahir.</div>
 <label>Nama</label><input id="fmName" placeholder="Nama ahli keluarga">
 <label>Hubungan</label><select id="fmRel"><option>Ayah</option><option>Ibu</option><option>Anak</option><option>Penjaga</option></select>
 <label>Avatar</label><select id="fmAv"><option>👨🏻</option><option>👩🏻</option><option>👦🏻</option><option>👧🏻</option><option>🧒🏻</option><option>🧕🏻</option><option>👤</option></select>
 <label>Tarikh lahir</label><input id="fmBirth" type="date">
 <button class="save" onclick="saveFamilyMember()">Tambah Ahli Keluarga</button>`;
    S.classList.add("on");
}
function saveFamilyMember() {
    let n = fmName.value.trim(), b = fmBirth.value, r = fmRel.value, a = fmAv.value;
    if (!n || !b)
        return alert("Masukkan nama dan tarikh lahir.");
    familyMembers.push({ name: n, relation: r, birth: b, avatar: a });
    if (r === "Anak") {
        let id = "kid" + Date.now();
        K[id] = { n: n, a: a, bal: 0, month: 0, year: 0, total: 0, today: [] };
    }
    saveLocal();
    S.classList.remove("on");
    page = "profile";
    render();
}
function taskForm() {
    let k = K[cur], sorted = [...savedTasks].sort((a, b) => b.uses - a.uses);
    P.innerHTML = `<button class="close" onclick="S.classList.remove('on')">✕</button>
 <h2>Tambah Tugasan</h2>
 <div class="sub">Untuk ${k.a} ${k.n} • Klik tugasan yang sudah dibuat</div>
 <div style="margin-top:14px">${sorted.map(t => `<div class="savedTaskRow"><button class="quicktask" onclick="quickAdd('${encodeURIComponent(t.name)}')"><div class="qico">${t.icon}</div><div class="qname">${t.name}</div><div class="qpts">+${t.stars} <span>★</span></div></button><button class="taskDelete" onclick="deleteSavedTask('${encodeURIComponent(t.name)}')" title="Padam tugasan">🗑️</button></div>`).join("")}</div>
 <button class="newtask" onclick="newTaskForm()">＋ Tugasan Baru</button>`;
    S.classList.add("on");
}
function deleteSavedTask(encodedName) {
    let name = decodeURIComponent(encodedName), i = savedTasks.findIndex(x => x.name === name);
    if (i < 0)
        return;
    if (!confirm(`Padam tugasan ${name}?`))
        return;
    savedTasks.splice(i, 1);
    saveLocal();
    taskForm();
}
function quickAdd(encodedName) {
    let name = decodeURIComponent(encodedName), t = savedTasks.find(x => x.name === name);
    if (!t)
        return;
    K[cur].today.push([t.icon, t.name, t.stars]);
    K[cur].bal += t.stars;
    K[cur].month += t.stars;
    K[cur].year += t.stars;
    K[cur].total++;
    t.uses++;
    saveLocal();
    S.classList.remove("on");
    page = "child";
    tab = "tasks";
    render();
}
function newTaskForm() {
    stars = 10;
    P.innerHTML = `<button class="close" onclick="S.classList.remove('on')">✕</button><button class="backbtn" onclick="taskForm()">← Tugasan Tersimpan</button>
 <h2>Tugasan Baru</h2><div class="sub">Taip sekali sahaja. Selepas ini tugasan akan disimpan untuk semua anak.</div>
 <label>Untuk anak</label><select id="fc">${Object.entries(K).map(([id, k]) => `<option value="${id}" ${id == cur ? "selected" : ""}>${k.a} ${k.n}</option>`).join("")}</select>
 <label>Nama tugasan</label><input id="tn" placeholder="Contoh: Lipat baju">
 <label>Ikon</label><select id="ti"><option>⭐</option><option>🛏️</option><option>🪥</option><option>📚</option><option>🕌</option><option>❤️</option><option>🍽️</option><option>🧸</option></select>
 <label>Bintang</label><div class="stars">${[5, 10, 15, 20].map(n => `<button class="${n == 10 ? "on" : ""}" onclick="stars=${n};document.querySelectorAll('.stars button').forEach(x=>x.classList.remove('on'));this.classList.add('on')">⭐ ${n}</button>`).join("")}</div>
 <button class="save" onclick="saveTask()">Simpan & Beri Bintang</button>`;
}
function saveTask() { let id = fc.value, n = tn.value.trim(), icon = ti.value; if (!n)
    return alert("Masukkan nama tugasan."); let existing = savedTasks.find(x => x.name.toLowerCase() === n.toLowerCase()); if (existing) {
    existing.icon = icon;
    existing.stars = stars;
    existing.uses++;
}
else {
    savedTasks.push({ icon: icon, name: n, stars: stars, uses: 1 });
} K[id].today.push([icon, n, stars]); K[id].bal += stars; K[id].month += stars; K[id].year += stars; K[id].total++; cur = id; page = "child"; tab = "tasks"; saveLocal(); S.classList.remove("on"); render(); }
function rewardForm() { P.innerHTML = `<button class="close" onclick="S.classList.remove('on')">✕</button><h2>Tambah Ganjaran</h2><div class="sub">Ganjaran ini akan digunakan untuk semua anak.</div><label>Jenis ganjaran</label><input id="rn" placeholder="Contoh: Aiskrim pilihan"><label>Ikon</label><select id="ri"><option>🎁</option><option>🍦</option><option>🎮</option><option>🎬</option><option>🍕</option><option>🧸</option></select><label>Bintang diperlukan</label><input id="rc" type="number" min="1" value="100"><button class="save" onclick="saveReward()">Simpan Ganjaran</button>`; S.classList.add("on"); }
function saveReward() { let n = rn.value.trim(), c = +rc.value; if (!n || !c)
    return alert("Lengkapkan maklumat ganjaran."); rewards.push([ri.value, n, c]); saveLocal(); S.classList.remove("on"); rewardPage(); }
function redeem(i) {
    let k = K[cur], r = rewards[i];
    if (!r || k.bal < r[2])
        return;
    P.innerHTML = `<button class="close" onclick="S.classList.remove('on')">✕</button>
 <h2>Pengesahan Tebus Ganjaran</h2>
 <div class="confirmBox"><strong>${r[0]} ${r[1]}</strong><br><br>
 Tebus ganjaran ini untuk <strong>${k.n}</strong>?<br>
 <strong>${r[2]} ⭐</strong> akan ditolak daripada baki semasa.</div>
 <button class="save" onclick="confirmRedeem(${i})">OK — Setuju</button>
 <button class="cancelBtn" onclick="S.classList.remove('on')">Cancel — Tidak Setuju</button>`;
    S.classList.add("on");
}
function confirmRedeem(i) {
    let k = K[cur], r = rewards[i];
    if (!r || k.bal < r[2]) {
        S.classList.remove("on");
        return;
    }
    k.bal -= r[2];
    saveLocal();
    S.classList.remove("on");
    rewardPage();
    alert(`${r[1]} berjaya ditebus untuk ${k.n}. ${r[2]} ⭐ ditolak daripada baki semasa.`);
}
document.querySelectorAll("[data-page]").forEach(b => b.onclick = () => { page = b.dataset.page; render(); });
document.getElementById("plus").onclick = taskForm;
S.onclick = e => { if (e.target == S)
    S.classList.remove("on"); };
loadLocal();
resetTodayIfNewDay();
render();

</script></body></html>
